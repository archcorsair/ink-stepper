name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

  publish:
    name: Publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify tag matches manifest versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          JSR_VERSION="$(jq -r .version jsr.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$JSR_VERSION" ]; then
            echo "::error::Version mismatch - tag ${GITHUB_REF_NAME} (=> ${TAG_VERSION}), package.json ${PKG_VERSION}, jsr.json ${JSR_VERSION}."
            echo "Bump both manifests (bun run version:patch keeps them in sync) and re-tag before publishing."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json and jsr.json (${TAG_VERSION})."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # npm is the primary registry, so it publishes first: a JSR failure then
      # never leaves the npm release missing.
      - name: Publish to npm (OIDC + provenance)
        run: npm publish --provenance --access public

      - name: Publish to JSR
        run: bun run publish:jsr

      - name: Verify both registries serve the tagged version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm_ok=0
          jsr_ok=0
          for attempt in 1 2 3 4 5; do
            if [ "$npm_ok" -eq 0 ]; then
              if curl -fsSL "https://registry.npmjs.org/ink-stepper" \
                | jq -e --arg v "$VERSION" '.versions | has($v)' >/dev/null 2>&1; then
                npm_ok=1
                echo "npm serves $VERSION"
              fi
            fi
            if [ "$jsr_ok" -eq 0 ]; then
              if curl -fsSL "https://jsr.io/@archcorsair/ink-stepper/meta.json" \
                | jq -e --arg v "$VERSION" '.versions | has($v)' >/dev/null 2>&1; then
                jsr_ok=1
                echo "jsr serves $VERSION"
              fi
            fi
            if [ "$npm_ok" -eq 1 ] && [ "$jsr_ok" -eq 1 ]; then
              echo "Both registries serve $VERSION"
              exit 0
            fi
            echo "attempt $attempt: npm_ok=$npm_ok jsr_ok=$jsr_ok - retrying in 10s"
            sleep 10
          done
          echo "::error::Registry verification failed for $VERSION (npm_ok=$npm_ok jsr_ok=$jsr_ok)"
          exit 1
